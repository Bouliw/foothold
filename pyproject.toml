[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "foothold"
version = "0.1.0"
description = "Account research for SDRs and BDRs: a sourced, dated brief for every target company, from public data."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = []
keywords = ["sales", "sdr", "bdr", "prospecting", "account research", "buying signals", "icp", "hubspot", "salesforce"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Programming Language :: Python :: 3",
    "Topic :: Office/Business",
]

[project.optional-dependencies]
claude = ["anthropic>=0.80"]
test = ["pytest>=7"]

[project.scripts]
foothold = "foothold.cli:main"

[project.urls]
Homepage = "https://github.com/Bouliw/foothold"
Issues = "https://github.com/Bouliw/foothold/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
foothold = ["web.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
